# Deploys the AppBucket API (worker/) to Cloudflare Workers.
# Needs three repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and OWNER_KEY.
# Until they are added, this workflow skips quietly so other pushes don't show failures.
name: Deploy API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["worker/**", "apps.json", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Cloudflare secrets not set yet, skipping the API deploy."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with: { node-version: 22 }
      - run: node --test tests/worker.test.mjs
        if: steps.check.outputs.ready == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          secrets: OWNER_KEY
        env:
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
