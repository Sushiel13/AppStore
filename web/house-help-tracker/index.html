<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13235b"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: quick-commerce app shell — gradient hero with summary card, today strip, rounded cards, bottom tab bar, sticky pay bar */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --sunk:#eef2f8; --ink:#0f1a3c; --muted:#66708a; --line:#e3e8f1;
  --navy:#13235b; --navy-2:#2445a8; --sky:#38bdf8; --sky-soft:#e0f4fe; --pop:#ffd23f;
  --accent:#13235b; --accent-ink:#ffffff;
  --p:#16a34a; --a:#ef4444; --h:#f59e0b; --l:#0ea5e9; --o:#b4bdcc;
  --p-soft:#e3f7ea; --a-soft:#fde8e8; --h-soft:#fef3dc; --l-soft:#e0f4fe;
  --p-ink:#15803d; --a-ink:#c53030; --h-ink:#b45309; --l-ink:#0369a1; --v:#8b5cf6; --v-soft:#ede9fe; --v-ink:#6d28d9;
  --acc:#2445a8; --btn:#13235b; --line2:#c4d4ee; --seg:#e4eaf3; --faint:#c6cdd9; --sky-soft2:#c7e7fd; --skel:#f8fafd; --toast-bg:#0f1a3c; --toast-ink:#ffffff;
  --r-lg:22px; --r:16px; --r-sm:12px;
  --sh:0 1px 2px rgba(15,26,60,.05),0 8px 24px rgba(15,26,60,.06);
  --f:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#151c33; --sunk:#1c2541; --ink:#e7ecf8; --muted:#9aa6c2; --line:#26304f;
  --sky-soft:#13294a; --sky-soft2:#1b3866; --o:#5b6787;
  --p-soft:#12301f; --a-soft:#3a1717; --h-soft:#3a2a10; --l-soft:#0f2a3d; --v-soft:#2a1f4d;
  --p-ink:#4ade80; --a-ink:#f87171; --h-ink:#fbbf24; --l-ink:#38bdf8; --v-ink:#c4b5fd;
  --acc:#8fb0ff; --btn:#3355c4; --line2:#33406a; --seg:#1c2541; --faint:#3a4566; --skel:#232d4d; --toast-bg:#e7ecf8; --toast-ink:#0b1020;
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#151c33; --sunk:#1c2541; --ink:#e7ecf8; --muted:#9aa6c2; --line:#26304f;
  --sky-soft:#13294a; --sky-soft2:#1b3866; --o:#5b6787;
  --p-soft:#12301f; --a-soft:#3a1717; --h-soft:#3a2a10; --l-soft:#0f2a3d; --v-soft:#2a1f4d;
  --p-ink:#4ade80; --a-ink:#f87171; --h-ink:#fbbf24; --l-ink:#38bdf8; --v-ink:#c4b5fd;
  --acc:#8fb0ff; --btn:#3355c4; --line2:#33406a; --seg:#1c2541; --faint:#3a4566; --skel:#232d4d; --toast-bg:#e7ecf8; --toast-ink:#0b1020;
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
.hacts{display:flex;gap:8px;align-items:center;flex:none}
.thb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
.thb svg{width:20px;height:20px}.thb:active{background:rgba(255,255,255,.25)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
body.light-top::before{background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{flex:none}
.hero{background:radial-gradient(120% 90% at 100% 0%,#3b63d6 0%,transparent 55%),linear-gradient(160deg,var(--navy) 0%,#1a2f78 100%);color:#fff;padding-bottom:64px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:rgba(56,189,248,.18)}
.hero .wrap{position:relative;z-index:1;padding-block:16px 0;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--pop)}
.greet{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:4px;text-wrap:balance}
.hbtn{border:0;background:#fff;color:var(--btn);border-radius:999px;padding:9px 14px;font-weight:800;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.hbtn svg{width:16px;height:16px}
.mp{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.mp button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:inherit;display:grid;place-items:center}
.mp button svg{width:18px;height:18px}
.mp b{font-size:14px;font-weight:700;padding:0 6px;min-width:120px;text-align:center}
.mp.light{background:var(--surface);box-shadow:var(--sh);color:var(--ink)}
.hrow2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.langb{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.langb svg{width:16px;height:16px}
.sum{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(15,26,60,.10);padding:18px;display:grid;gap:12px}
.sum.lift{margin-top:-70px;position:relative;z-index:2}
.sum .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sum .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.sum .of{font-size:14px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),#4ade80)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{background:var(--sunk);border-radius:var(--r-sm);padding:10px}
.mini b{display:block;font-size:17px;font-weight:800}
.mini span{font-size:12px;color:var(--muted);font-weight:600}
main.body{padding-block:18px 110px;display:flex;flex-direction:column;gap:14px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sech h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.sech span{font-size:13px;color:var(--muted);font-weight:600}
.strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.story{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;padding:0}
.story .ring{padding:3px;border-radius:50%;background:var(--o)}
.story .ring.P{background:conic-gradient(var(--p),#4ade80,var(--p))}.story .ring.A{background:var(--a)}.story .ring.H{background:conic-gradient(var(--p) 0 50%,var(--h) 50% 100%)}.story .ring.L{background:var(--l)}.story .ring.V{background:var(--v)}
.story .ring .av{box-shadow:0 0 0 3px var(--bg)}
.story b{font-size:12.5px;font-weight:700;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story small{font-size:11px;font-weight:700;margin-top:-6px}
.story small.P{color:var(--p)}.story small.A{color:var(--a)}.story small.H{color:var(--h-ink)}.story small.L{color:var(--l)}.story small.O{color:var(--muted)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:linear-gradient(140deg,var(--sky-soft),var(--sky-soft2));color:var(--acc);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:38px;height:38px;font-size:15px}
.av.lg{width:72px;height:72px;font-size:28px}
.list{display:flex;flex-direction:column;gap:12px}
.scard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px;display:grid;gap:12px;cursor:pointer}
.scard .top{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.scard .nm{font-weight:800;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.scard .rl{color:var(--muted);font-size:13px;font-weight:600}
.scard .amt{text-align:right}
.scard .amt b{font-size:18px;font-weight:800;display:block;letter-spacing:-.02em}
.scard .amt s{font-size:12px;color:var(--muted)}
.scard .amt span{font-size:12px;color:var(--muted);font-weight:600}
.scard .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--sunk);color:var(--muted)}
.chip.A{background:var(--a-soft);color:var(--a-ink)}.chip.H{background:var(--h-soft);color:var(--h-ink)}.chip.L{background:var(--l-soft);color:var(--l-ink)}.chip.paid{background:var(--p-soft);color:var(--p-ink)}.chip.part{background:var(--h-soft);color:var(--h-ink)}
.tbtn{border:1.5px solid var(--p);color:var(--p-ink);background:var(--p-soft);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:5px}
.tbtn.A{border-color:var(--a);color:var(--a-ink);background:var(--a-soft)}.tbtn.H{border-color:var(--h);color:var(--h-ink);background:var(--h-soft)}.tbtn.L{border-color:var(--l);color:var(--l-ink);background:var(--l-soft)}.tbtn.V{border-color:var(--v);color:var(--v-ink);background:var(--v-soft)}.tbtn.O{border-color:var(--o);color:var(--muted);background:var(--sunk)}
.tbtn svg{width:14px;height:14px}
.scard.gone{opacity:.65}
.addcard{border:2px dashed var(--line2);background:transparent;border-radius:var(--r-lg);padding:16px;font-weight:800;color:var(--acc);display:flex;align-items:center;justify-content:center;gap:8px}
.addcard svg{width:18px;height:18px}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.skel{height:96px;border-radius:var(--r-lg);background:linear-gradient(90deg,var(--sunk) 0%,var(--skel) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.banner{background:var(--h-soft);color:var(--h-ink);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;font-weight:600}
.phead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.phead .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:62px}
.phead h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .t{flex:1;min-width:0}
.phead .t span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:20px;height:20px}
.tabtitle{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px}
.cal{padding:16px 10px 14px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:11.5px;color:var(--muted);padding-bottom:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.grid{row-gap:8px}
.day{justify-self:center;width:min(44px,11vw);aspect-ratio:1;max-width:100%;border-radius:13px;border:0;background:transparent;font-weight:800;font-size:14.5px;display:grid;place-items:center;position:relative;color:var(--ink)}
.day.P{background:var(--p-soft);color:var(--p-ink)}
.day.A{background:var(--a);color:#fff}
.day.H{background:linear-gradient(135deg,var(--p-soft) 50%,var(--h) 50%);color:var(--ink)}
.day.L{background:var(--l);color:#fff}
.day.O{color:var(--muted);background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px var(--o)}
.day.V{background:var(--v-soft);color:var(--v-ink)}
.day.F{font-weight:600;color:var(--ink);background:var(--sunk)}
.day.N{color:var(--faint);font-weight:500;cursor:default}
.day.sel{box-shadow:0 0 0 2.5px var(--surface),0 0 0 4.5px var(--btn)}
.day.today::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--pop);box-shadow:0 0 0 1.5px var(--btn)}
.day .dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:currentColor}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.selp{display:flex;flex-direction:column;gap:12px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.seldate{font-size:21px;font-weight:800;letter-spacing:-.02em}
.seldate small{display:block;font-size:11.5px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.1em}
.stag{font-size:12.5px;font-weight:800;border-radius:8px;padding:5px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.stag.P{background:var(--p-soft);color:var(--p-ink)}.stag.A{background:var(--a-soft);color:var(--a-ink)}.stag.H{background:var(--h-soft);color:var(--h-ink)}.stag.L{background:var(--l-soft);color:var(--l-ink)}
.note{font-size:13.5px;color:var(--muted);margin-top:-6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink)}
.q i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff}
.q i svg{width:17px;height:17px}
.q[aria-pressed="true"]{border-color:var(--btn);background:var(--sky-soft)}
.q.more i{background:var(--sunk);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--surface);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:19px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:700}
.slip h3,.log h3{font-size:16px;margin:0 0 10px;font-weight:800}
.slip h3{margin-bottom:2px}.slipper{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.ln span:first-child{color:var(--muted);min-width:0;font-weight:500}
.ln span:last-child{font-weight:700}
.ln.sub span:first-child{padding-left:12px}
.ln.tot{border-top:2px dashed var(--line);margin-top:8px;padding-top:12px;font-size:17px}
.ln.tot span{color:var(--ink);font-weight:800}
.ln.ded span:last-child{color:var(--a)}
.hr{height:1px;background:var(--line);margin:6px 0}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.adj label{font-size:12px;color:var(--muted);display:grid;gap:4px;font-weight:700}
.adj input{border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 11px;width:100%;font-weight:700}
#upiGo.off{opacity:.45;pointer-events:none}
.upirow{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}.upirow span{color:var(--muted);font-weight:600}.upirow b{flex:1;min-width:0;overflow-wrap:anywhere}
.advrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.advrow:first-of-type{border-top:0}.advrow b{display:block;font-size:14.5px}.advrow span{font-size:12.5px;color:var(--muted);font-weight:600}
.advrow .bal{font-weight:800;font-size:15px;white-space:nowrap}
.paylist{display:grid;gap:6px;margin-top:12px}
.paidnote{margin-top:12px;background:var(--p-soft);color:var(--p-ink);font-weight:700;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.paidnote button{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-weight:700}
.log ul{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log li .d{width:70px;flex:none;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.log li .n{min-width:0;overflow-wrap:anywhere}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15px;background:var(--btn);color:#fff;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:var(--a-soft);color:var(--a-ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{border:0;background:transparent;color:var(--acc);font-weight:800;padding:4px 0;text-align:left}
.paybar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.paybar .in{max-width:536px;margin:0 auto;background:var(--p);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(22,163,74,.35);pointer-events:auto}
.paybar.done .in{background:var(--btn);box-shadow:0 10px 30px rgba(19,35,91,.35)}
.paybar .t{flex:1;min-width:0}
.paybar .t b{display:block;font-size:17px;font-weight:800}
.paybar .t span{font-size:12px;opacity:.9;font-weight:600}
.paybar button{border:0;background:#fff;color:#0f1a3c;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.paybar button svg{width:16px;height:16px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -6px 20px rgba(15,26,60,.05);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 0}

const ini=s=>esc(((s.name||"?").trim()[0]||"?").toUpperCase());

function shrinkPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const n=240,c=document.createElement("canvas");c.width=c.height=n;const k=Math.min(im.width,im.height);
  c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,n,n);res(c.toDataURL("image/jpeg",.82))};im.src=fr.result};fr.readAsDataURL(file)})}
function monthPill(light){return`<div class="mp ${light?"light":""}"><button id="pm" aria-label="Previous month">${IC.l}</button><b class="num">${MON[S.m]} ${S.y}</b><button id="nm" aria-label="Next month">${IC.r}</button></div>`}

function shift(k){let m=S.m+k,y=S.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.y=y;S.m=m;S.sel=null;S.months={};subMonth();render();}

   if(s.temp)ch.unshift(`<span class="chip L">Temporary</span>`);if(r.basis==="week")ch.unshift(`<span class="chip">Weekly pay</span>`);else if(r.basis==="day")ch.unshift(`<span class="chip">Daily pay</span>`);
   if(r.full)ch.push(`<span class="chip paid">Paid ✓</span>`);else if(r.paidAmt>0)ch.push(`<span class="chip part">Part paid</span>`);if(!ch.some(x=>!/>(Temporary|Weekly pay|Daily pay)</.test(x)))ch.push(`<span class="chip">No leave yet</span>`);

    <div class="bot"><div class="chips">${ch.join("")}</div>${st?`<button class="tbtn ${st}" data-today="${esc(s.id)}">${st==="A"?IC.x:st==="P"?IC.ok:IC.cal}Today: ${SHORT[st]}</button>`:""}</div></div>`};

 <section class="hero"><div class="wrap">
  <div class="hrow"><div><div class="brand"><i></i>House Help Tracker</div><div class="greet">${greet()}${S.settings.sign?", "+esc(S.settings.sign.split(" ")[0]):""}</div></div>
   <div class="hacts"><button class="hbtn" id="addTop">${IC.plus}Add help</button><button class="thb" id="themeBtn" aria-label="${isDark()?"Light mode":"Dark mode"}" title="${isDark()?"Light mode":"Dark mode"}">${isDark()?sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'):sv('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>')}</button></div></div>
  <div class="hrow2">${monthPill()}<button class="langb" id="langBtn" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span translate="no">${{en:"English",hi:"हिंदी",mr:"मराठी"}[LANG]}</span></button></div>
 </div></section>
 <main class="wrap body">
  <div class="sum lift num"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap"><div><div class="lbl">${cur?"Expected pay":"Payable"} · ${MSH[S.m]}</div><div class="big">${rs(tot)}</div></div><div class="of">${paidN}/${act.length} paid</div></div>

   return`<button class="alert" id="bkAlert"><i class="red">${IC.box}</i><div style="min-width:0;flex:1"><b>Back up your records</b><span style="white-space:normal">${age===null?"Save a copy so a lost or reset phone doesn't lose your records.":`Last backup ${age} days ago.`}</span></div>${IC.r}</button>`})()}
  ${false?`<div class="banner">Saving on this device only. Open this page from your Claude app to keep records safely.</div>`:""}

 let cells="";for(let i=0;i<first;i++)cells+="<span></span>";

  cells+=`<button class="day ${st}${S.sel===d?" sel":""}${+dt===+T0?" today":""}" data-d="${d}" ${st==="N"?"disabled":""} aria-label="${d} ${MON[m]}: ${st==="N"?"not working":LBL[st]}">${d}${note?'<span class="dot"></span>':""}</button>`;}

 const span=[s.join?"Joined "+fmtL(jd(s)):"Joining date not set",s.exit?"Last day "+fmtL(xd(s)):""].filter(Boolean).join(" · ");
 let selp="";if(S.sel){const sd=new Date(y,m,S.sel),st=status(s,y,m,S.sel,r.days),nt=r.days[S.sel]&&r.days[S.sel].note;
  const qb=(k,lab,ic,bg)=>`<button class="q" data-q="${k}" aria-pressed="${st===k}"><i style="background:${bg}">${ic}</i>${lab}</button>`;
  selp=`<div class="panel selp"><div class="selhead"><div class="seldate"><small>${+sd===+T0?"Today":DOW[sd.getDay()]}</small>${S.sel} ${MON[m]}</div><span class="stag ${st}">${LBL[st]}</span></div>
   ${nt?`<div class="note" translate="no">${esc(nt)}</div>`:""}

Today is ${iso(T0)}.

/* Reads OCR lines [{t:text,h:lineHeight}] from a pack into {name, exp, monthOnly, dateText, names, dates, text}. */
const MONS={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,SEPT:9,OCT:10,NOV:11,DEC:12};
const MONRX="SEPT|JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC";
function findDates(U){const out=[],taken=[];const free=(a,b)=>!taken.some(([x,y])=>a<y&&b>x);
 const yr=s=>{let y=+s;if(s.length===2)y+=2000;return y>=2015&&y<=2045?y:0};
 const add=(m,y,mo,d,monthOnly)=>{const a=m.index,b=a+m[0].length;if(!y||!mo||mo<1||mo>12||!free(a,b))return;if(!monthOnly&&(d<1||d>dim(y,mo-1)))return;
  taken.push([a,b]);out.push({i:a,e:b,iso:iso(monthOnly?new Date(y,mo,0):new Date(y,mo-1,d)),mo:monthOnly,txt:m[0].trim()})};
 let m;

 while((m=r1.exec(U))){let d=+m[1],mo=+m[2];if(mo>12&&d<=12){const x=d;d=mo;mo=x}add(m,yr(m[3]),mo,d,false)}

 while((m=r2.exec(U)))add(m,yr(m[3]),MONS[m[2]],+m[1],false);
 const r3=new RegExp("\\b("+MONRX+")[A-Z]*\\.?\\s?[\\/.\\-' ]?\\s?(\\d{4}|\\d{2})(?!\\d)","g");
 while((m=r3.exec(U)))add(m,yr(m[2]),MONS[m[1]],0,true);

 while((m=r4.exec(U)))add(m,yr(m[2]),+m[1],0,true);

function parsePack(lines){

 const MFG=/(MFG\.?|MFD\.?|MFGD|MANUFACTURED|MANUFACTURING|MANUF\.?|PKD\.?|PACKED|PACKAGED|PACKING|DATE\s*OF\s*(?:MFG|MANUFACTURE|PACKING)|\bDOM\b|\bPKG\b|निर्माण|उत्पादन|पैकिंग|पॅकिंग|पैक\s*किया|पॅक\s*केल|उत्पादित)/g;
 while((m=EXP.exec(U)))labels.push({i:m.index,e:m.index+m[0].length,k:"exp"});
 while((m=MFG.exec(U)))labels.push({i:m.index,e:m.index+m[0].length,k:"mfg"});
 labels.sort((a,b)=>a.i-b.i);const usedL=new Set();
 D.forEach(d=>{const cand=labels.filter((l,ix)=>!usedL.has(ix)&&l.e<=d.i&&d.i-l.e<=80);if(!cand.length)return;const l=cand[0];usedL.add(labels.indexOf(l));d.k=l.k});

 // name
 const STOP=/(मूल्य|अधिकतम|खुदरा|किंमत|कमाल|बैच|बॅच|निर्माण|उत्पादन|पैक|पॅक|समाप्ति|समाप्ती|उपयोग|वापरा|शुद्ध|निव्वळ|वजन|सामग्री|घटक|पोषण|ग्राहक|संपर्क|पता|पत्ता|भारत|सर्व करांसहित|सभी करों|MRP|M\.R\.P|RS\.|₹|EXP|MFG|MFD|PKD|BATCH|B\.?\s?NO|LOT\b|NET\s*(WT|QTY|VOL|CONTENT|WEIGHT)|FSSAI|LIC\.?\s?NO|INGREDIENT|NUTRITION|NUTRITIONAL|CUSTOMER|CARE\s*(LINE|NO)|WWW|\.COM|@|INCL|TAXES|BEST\s*BEFORE|USE\s*BY|STORE\s|STORAGE|ENERGY|PROTEIN|CARBOHYDRATE|FAT|SUGARS?\b|SODIUM|KCAL|MANUFACTURED|MARKETED|PACKED|ADDRESS|PVT|LTD|ROAD|DIST\b|PIN\b|BARCODE|TOLL\s*FREE|EMAIL|SERVING|DIRECTIONS|CAUTION|WARNING|PRODUCT\s*OF|MADE\s*IN|ORIGIN|KEEP\s|COOL|DRY\sPLACE)/i;
 const tc=s=>/[a-z]/.test(s)?s:s.toLowerCase().replace(/(^|[\s(\-\/&])([a-z])/g,(x,a,b)=>a+b.toUpperCase());
 const cands=[];lines.slice().sort((a,b)=>b.h-a.h).forEach(l=>{const s=l.t;const letters=(s.match(/\p{L}/gu)||[]).length,digits=(s.match(/\d/g)||[]).length;
  if(s.length<3||s.length>45||letters<3||digits>letters||STOP.test(s))return;const v=tc(s);if(!cands.some(c=>c.toLowerCase()===v.toLowerCase()))cands.push(v)});
 let name=cands[0]||"";
 if(cands[1]){const h0=(lines.find(l=>tc(l.t)===cands[0])||{}).h||0,h1=(lines.find(l=>tc(l.t)===cands[1])||{}).h||0;const dev=s=>/[\u0900-\u097F]/.test(s);if(h1>=.4*h0&&dev(cands[0])===dev(cands[1])&&(name+" "+cands[1]).length<=48)name=name+" "+cands[1]}

/* ---------- app lock (Android app): 4-digit PIN, optional fingerprint ---------- */
const LOCK_KEY="hh.lock";
const lockCfg=()=>{try{return JSON.parse(localStorage.getItem(LOCK_KEY)||"null")}catch(e){return null}};
async function pinHash(salt,pin){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const bioAvailable=()=>{try{return!!(window.HHNative&&typeof window.HHNative.bioAvailable==="function"&&window.HHNative.bioAvailable())}catch(e){return false}};
let lockedNow=false,hiddenAt=0;
function showLock(){const cfg=lockCfg();if(!cfg||lockedNow)return;lockedNow=true;let pin="";const el=document.createElement("div");el.className="lock";el.id="lockScreen";
 el.innerHTML=`<h2>House Help Tracker</h2><p>Enter your PIN</p><div class="pdots" id="pdots">${"<i></i>".repeat(4)}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}${cfg.bio&&bioAvailable()?`<button class="ghost" id="lbio" aria-label="Use fingerprint">👆</button>`:"<span></span>"}<button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Delete">⌫</button></div>
  <p>Forgot PIN? Uninstall and reinstall the app, then restore your backup.</p>`;
 document.body.appendChild(el);
 const dots=()=>el.querySelectorAll("#pdots i").forEach((d,i)=>d.classList.toggle("on",i<pin.length));
 const unlock=()=>{lockedNow=false;el.remove()};
 el.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==="del")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;dots();
  if(pin.length===4){if(await pinHash(cfg.salt,pin)===cfg.hash)unlock();else{const d=el.querySelector("#pdots");d.classList.add("bad");setTimeout(()=>{d.classList.remove("bad");pin="";dots()},350)}}});
 window.hhBioDone=ok=>{if(ok)unlock()};
 if(el.querySelector("#lbio")){el.querySelector("#lbio").onclick=()=>window.HHNative.bioAuth();setTimeout(()=>{try{window.HHNative.bioAuth()}catch(e){}},300)}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(lockCfg()&&hiddenAt&&Date.now()-hiddenAt>60000)showLock()});
function pinSheet(){let first="";
 openSheet(`<h3>Set a PIN</h3><p class="hint">The app asks for this PIN when it opens.</p>
  <label class="field" for="pin1"><span>New 4-digit PIN</span><input id="pin1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
  <label class="field" for="pin2"><span>Enter it again</span><input id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label>
  ${bioAvailable()?`<label class="check" for="pbio"><input type="checkbox" id="pbio" checked> Also unlock with fingerprint</label>`:""}
  <p class="hint" id="pinerr" style="color:var(--a);margin:0" hidden></p><button class="btn" id="pinsv">Turn on app lock</button>`,()=>{
  $("#pinsv").onclick=async()=>{const a=$("#pin1").value,b=$("#pin2").value,err=t=>{const e=$("#pinerr");e.textContent=t;e.hidden=false};
   if(!/^\d{4}$/.test(a))return err("Enter 4 digits.");if(a!==b)return err("The two PINs don't match.");
   const salt=Math.random().toString(36).slice(2,10);try{localStorage.setItem(LOCK_KEY,JSON.stringify({salt,hash:await pinHash(salt,a),bio:!!($("#pbio")&&$("#pbio").checked)}))}catch(e){return err("Couldn't save the PIN.")}
   closeSheet();render();toast("App lock is on")}})}

/* ---------- barcode (Android app) ---------- */
let bcWait=null;
window.hhBarcode=function(code,err){const w=bcWait;bcWait=null;if(w)w(code||null)};
const canBarcode=()=>!!(IS_APP&&window.HHNative&&typeof window.HHNative.scanBarcode==="function");
function scanBarcode(){return new Promise(res=>{bcWait=res;try{window.HHNative.scanBarcode()}catch(e){bcWait=null;res(null)}})}
async function lookupBarcode(code){
 const known=S.products.find(p=>p.barcode===code);if(known)return{name:known.name,cat:catOf(known),src:"saved"};
 for(const host of["world.openfoodfacts.org","world.openbeautyfacts.org"]){
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
   const res=await fetch(`https://${host}/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,brands,categories_tags`,{signal:ctl.signal});clearTimeout(tm);
   if(!res.ok)continue;const j=await res.json();const pr=j&&j.status===1&&j.product;if(!pr)continue;
   const nm=String(pr.product_name||pr.product_name_en||"").trim(),br=String(pr.brands||"").split(",")[0].trim();if(!nm&&!br)continue;
   const name=(br&&nm&&!nm.toLowerCase().includes(br.toLowerCase())?br+" "+nm:nm||br).slice(0,120);
   return{name,cat:guessCat(name+" "+(pr.categories_tags||[]).join(" ").replace(/en:|-/g," "))||(host.includes("beauty")?"personal":""),src:"web"}}catch(e){}}
 return null}

/* ---------- backup and restore ---------- */
const BK_KEY="hh.lastBackup";
function lastBackup(){let v="";try{v=localStorage.getItem(BK_KEY)||""}catch(e){}return v||S.settings.lastBackup||""}
function markBackedUp(){const v=new Date().toISOString();try{localStorage.setItem(BK_KEY,v)}catch(e){}S.settings={...S.settings,lastBackup:v};store.saveSettings(S.settings);render()}
async function collectBackup(){
 if(db){const sn=await Promise.all(["staff","products","att"].map(c=>db.collection(c).get()));const docs=x=>x.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
  return{staff:docs(sn[0]),products:docs(sn[1]),att:docs(sn[2]),settings:S.settings}}
 return{staff:Object.values(mem.staff),products:Object.values(mem.products||{}),att:Object.values(mem.att),settings:mem.settings}}
async function saveBackup(share){let json;try{json=JSON.stringify({app:"house-help-attendance",format:1,exportedAt:new Date().toISOString(),...await collectBackup()})}catch(e){toast("Couldn't save the backup.");return}
 const name=`house-help-backup-${iso(new Date())}.json`;
 if(IS_APP&&window.HHNative&&typeof window.HHNative.saveFile==="function"){share?window.HHNative.shareFile(name,json):window.HHNative.saveFile(name,json);return}
 const dl=window.claude?await window.claude.use("downloads").catch(()=>null):null;if(!dl){toast("Saving files isn't available here.");return}
 try{await dl.save({filename:name,data:json});markBackedUp();toast("Backup saved")}catch(e){if(!e||e.code!=="declined")toast("Couldn't save the backup.")}}
window.hhFileSaved=function(ok){if(ok){markBackedUp();toast("Backup saved")}else toast("Backup not saved")};
function restorePick(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;let d=null;try{d=JSON.parse(await f.text())}catch(e){}
  if(!d||d.app!=="house-help-attendance"||!Array.isArray(d.staff)){toast("That file isn't a House Help backup.");return}restoreSheet(d)};i.click()}
function restoreSheet(d){const staff=d.staff.filter(x=>x&&x.id),prods=(d.products||[]).filter(x=>x&&x.id),att=(d.att||[]).filter(a=>a&&a.staffId&&a.month);
 const months=new Set(att.map(a=>a.month)).size,when=d.exportedAt?new Date(d.exportedAt):null;
 openSheet(`<h3>Restore backup</h3>${when&&!isNaN(when)?`<p class="hint">Backup from ${fmtD(when)}</p>`:""}
  <div class="minis num"><div class="mini"><b>${staff.length}</b><span>House help</span></div><div class="mini"><b>${months}</b><span>Months</span></div><div class="mini"><b>${prods.length}</b><span>Items</span></div></div>
  <p class="hint" style="margin:0;color:var(--a)">This replaces everything currently in the app with the backup.</p>
  <button class="btn danger" id="rgo">Replace with backup</button><button class="btn ghost" id="rno">Cancel</button>`,()=>{
  $("#rno").onclick=closeSheet;
  $("#rgo").onclick=async()=>{const b=$("#rgo");b.disabled=true;b.textContent="Restoring…";
   try{await applyRestore(staff,prods,att,d.settings||{});closeSheet();S.cur=null;S.tab="home";render();toast("Backup restored")}
   catch(e){console.error(e);b.disabled=false;b.textContent="Replace with backup";toast("Couldn't restore. Try again.")}}})}
async function applyRestore(staff,prods,att,settings){
 const keepSign=S.settings.sign;
 if(!db){mem.staff={};staff.forEach(s=>mem.staff[s.id]=s);mem.products={};prods.forEach(p=>mem.products[p.id]=p);
  mem.att={};att.forEach(a=>mem.att[a.staffId+"_"+a.month]=a);mem.settings={...mem.settings,...settings,sign:settings.sign||keepSign||""};memSave();pullLocal();return}
 const want={staff:new Map(staff.map(s=>[s.id,s])),products:new Map(prods.map(p=>[p.id,p])),att:new Map(att.map(a=>[a.staffId+"_"+a.month,a]))};
 for(const c of["staff","products","att"]){const cur=await db.collection(c).get();
  for(const doc of cur.docs)if(!want[c].has(doc.id))await db.doc(c+"/"+doc.id).delete();
  for(const[id,v]of want[c])await db.doc(c+"/"+id).set(v)}
 S.settings={...S.settings,...settings,sign:settings.sign||keepSign||""};await db.doc("settings/main").set(S.settings);subMonth()}

["Your own number or family's, up to 3, separated by commas. Each expiry notification gets a Send on WhatsApp button; WhatsApp opens with the alert typed, and you tap send.","अपना या परिवार का नंबर, अधिकतम 3, कॉमा से अलग करें। हर एक्सपायरी नोटिफ़िकेशन में WhatsApp पर भेजें बटन होगा; WhatsApp सूचना लिखी हुई खुलेगी, आप बस भेजें दबाएँ।","तुमचा किंवा कुटुंबाचा नंबर, जास्तीत जास्त 3, स्वल्पविरामाने वेगळे करा. प्रत्येक एक्सपायरी नोटिफिकेशनमध्ये WhatsApp वर पाठवा बटण असेल; WhatsApp सूचना लिहिलेली उघडेल, तुम्ही फक्त पाठवा दाबा."],
["Your own number or family's, up to 3, separated by commas. On the Expiry tab, Send on WhatsApp opens WhatsApp with the alert typed, and you tap send.","अपना या परिवार का नंबर, अधिकतम 3, कॉमा से अलग करें। एक्सपायरी टैब पर WhatsApp पर भेजें दबाने से WhatsApp सूचना लिखी हुई खुलेगी, आप बस भेजें दबाएँ।","तुमचा किंवा कुटुंबाचा नंबर, जास्तीत जास्त 3, स्वल्पविरामाने वेगळे करा. एक्सपायरी टॅबवर WhatsApp वर पाठवा दाबल्यावर WhatsApp सूचना लिहिलेली उघडेल, तुम्ही फक्त पाठवा दाबा."],
["Enter 10-digit mobile numbers, separated by commas.","10 अंकों के मोबाइल नंबर कॉमा से अलग करके लिखें।","10 अंकी मोबाइल नंबर स्वल्पविरामाने वेगळे करून लिहा."],["Pay","भुगतान करें","पैसे द्या"],["Mobile","मोबाइल","मोबाइल"],["Number copied","नंबर कॉपी हो गया","नंबर कॉपी झाला"],
["No UPI ID saved, so pay to the mobile number. Tap your UPI app (the number is copied), choose “Pay phone number”, paste it and pay. Then come back and record the payment.","UPI ID सेव नहीं है, इसलिए मोबाइल नंबर पर भुगतान करें। अपना UPI ऐप दबाएँ (नंबर कॉपी हो जाएगा), “फ़ोन नंबर पर भुगतान” चुनें, नंबर पेस्ट करके भुगतान करें। फिर यहाँ लौटकर भुगतान दर्ज करें।","UPI ID जतन नाही, म्हणून मोबाइल नंबरवर पैसे द्या. तुमचे UPI ॲप दाबा (नंबर कॉपी होईल), “फोन नंबरवर पैसे द्या” निवडा, नंबर पेस्ट करून पैसे द्या. मग इथे परत येऊन नोंद करा."],
["No UPI ID saved, so pay to the mobile number. Copy it, open your UPI app, choose “Pay phone number”, paste it and pay. Then come back and record the payment.","UPI ID सेव नहीं है, इसलिए मोबाइल नंबर पर भुगतान करें। नंबर कॉपी करें, अपना UPI ऐप खोलें, “फ़ोन नंबर पर भुगतान” चुनें, पेस्ट करके भुगतान करें। फिर यहाँ लौटकर भुगतान दर्ज करें।","UPI ID जतन नाही, म्हणून मोबाइल नंबरवर पैसे द्या. नंबर कॉपी करा, तुमचे UPI ॲप उघडा, “फोन नंबरवर पैसे द्या” निवडा, पेस्ट करून पैसे द्या. मग इथे परत येऊन नोंद करा."],
["Add a UPI ID or mobile number in Edit to pay from here.","यहीं से भुगतान के लिए एडिट में UPI ID या मोबाइल नंबर जोड़ें।","इथूनच पैसे देण्यासाठी एडिटमध्ये UPI ID किंवा मोबाइल नंबर जोडा."],
["Number copied. Choose “Pay phone number” and paste it.","नंबर कॉपी हो गया। “फ़ोन नंबर पर भुगतान” चुनें और पेस्ट करें।","नंबर कॉपी झाला. “फोन नंबरवर पैसे द्या” निवडा आणि पेस्ट करा."],["Couldn't open that app.","वह ऐप नहीं खुला।","ते ॲप उघडले नाही."],["Tap Scan to photograph the name or the date, or the mic to say it.","फ़ोटो के लिए स्कैन या बोलने के लिए माइक दबाएँ — नाम या तारीख।","फोटोसाठी स्कॅन किंवा बोलण्यासाठी माइक दाबा — नाव किंवा तारीख."],
["Tap the mic to say the name or the date.","नाम या तारीख बोलने के लिए माइक दबाएँ।","नाव किंवा तारीख बोलण्यासाठी माइक दाबा."],["Say product name","उत्पाद का नाम बोलें","उत्पादनाचे नाव बोला"],["Say expiry date","एक्सपायरी तारीख बोलें","एक्सपायरी तारीख बोला"],

["Didn't catch that. Tap the mic and try again.","सुनाई नहीं दिया। माइक दबाकर फिर बोलें।","ऐकू आले नाही. माइक दाबून पुन्हा बोला."],["Name filled in. Now add the expiry date.","नाम भर दिया। अब एक्सपायरी तारीख जोड़ें।","नाव भरले. आता एक्सपायरी तारीख जोडा."],

const TRM={hi:new Map(),mr:new Map()};TRD.forEach(([e,h,m])=>{TRM.hi.set(e,h);TRM.mr.set(e,m)});
function trOne(s){const M=TRM[LANG];if(!M)return null;if(M.has(s))return M.get(s);
 for(const[re,h,m]of TRP){const x=s.match(re);if(x){const tpl=LANG==="hi"?h:m;
  return tpl.replace(/\{T(\d)\}|\{L(\d)\}|\$(\d)/g,(_,a,b,c)=>a?(trOne(x[a]||"")??(x[a]||"")):b?(x[b]||"").split(", ").map(p=>trOne(p)??p).join(", "):(x[c]||""))}}
 return null}
function trSent(k){const ps=k.split(/(?<=[.!?।…])\s+/);if(ps.length<2)return null;const tp=ps.map(p=>trOne(p)??p);return tp.some((v,i)=>v!==ps[i])?tp.join(" "):null}
function trStr(s){if(LANG==="en"||!s)return s;const k=s.trim();if(!k)return s;let r=trOne(k);
 if(r==null&&k.includes(" · ")){const parts=k.split(" · ");const tp=parts.map(p=>trOne(p)??trSent(p)??p);if(tp.some((v,i)=>v!==parts[i]))r=tp.join(" · ")}
 if(r==null)r=trSent(k);
 if(r==null)return s;const i=s.indexOf(k);return s.slice(0,i)+r+s.slice(i+k.length)}
const TR_SKIP="script,style,textarea,[translate='no']";
function trNode(n){const p=n.parentElement;if(!p||p.closest(TR_SKIP))return;const v=n.nodeValue,o=trStr(v);if(o!==v)n.nodeValue=o}
function trEl(el){if(el.closest("[translate='no']"))return;for(const a of["placeholder","aria-label","title"]){const v=el.getAttribute(a);if(v){const o=trStr(v);if(o!==v)el.setAttribute(a,o)}}}
function trTree(root){if(LANG==="en")return;if(root.nodeType===3)return trNode(root);if(root.nodeType!==1)return;trEl(root);root.querySelectorAll("*").forEach(trEl);
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))trNode(n)}
new MutationObserver(ms=>{if(LANG==="en")return;for(const m of ms){if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trTree)}})
 .observe(document.body,{childList:true,subtree:true,characterData:true});
function setLang(l){if(!LANGS.some(x=>x[0]===l))return;LANG=l;try{localStorage.setItem("hh.lang",l)}catch(e){}setLocaleNames();closeSheet();render();syncNative()}
function langSheet(){openSheet(`<h3>Language</h3><div class="opts" translate="no">${LANGS.map(([k,l])=>`<button class="opt" data-lang="${k}" aria-pressed="${LANG===k}">${l}</button>`).join("")}</div>`,
 el=>el.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang)))}

 db.collection("staff").onSnapshot(sn=>{S.staff=sn.docs.map(x=>JSON.parse(JSON.stringify(x.data()))).sort((a,b)=>(a.order||0)-(b.order||0));S.mode="live";render()},e=>console.error(e));
 db.collection("products").onSnapshot(sn=>{S.products=sn.docs.map(x=>JSON.parse(JSON.stringify(x.data())));render()},e=>console.error(e));
 db.doc("settings/main").onSnapshot(sn=>{if(sn.exists){S.settings=JSON.parse(JSON.stringify(sn.data()));render()}},()=>{});
 subMonth();
 db.collection("att").get().then(sn=>{const o={};sn.docs.forEach(x=>{const v=JSON.parse(JSON.stringify(x.data()));o[v.staffId+"_"+v.month]=v});S.att=Object.assign(o,S.att||{});render()}).catch(e=>console.error(e));
})();
})();
</script>
