# AppBucket API: download counter, visitor counter and forms. Free Cloudflare Workers plan.
# Deployed by .github/workflows/worker.yml. The site finds it through "api" in apps.json.
name = "appbucket-api"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://appbucket.in,https://www.appbucket.in,https://sushiel13.github.io,http://localhost:8000"
# Totals from the old Netlify counter on 19 Nov 2026. Used only the very first time the Worker runs.
START_DOWNLOADS = '{"house-help-tracker":8}'
START_VISITORS = "297"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# SQLite-backed Durable Objects are included in the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
