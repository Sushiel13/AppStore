<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AppBucket</title>
<meta name="description" content="AppBucket: simple, private Android apps for Indian homes. Download House Help Tracker and more, free.">
<meta name="theme-color" content="#13235b">
<meta property="og:title" content="AppBucket">
<meta property="og:description" content="Simple, private Android apps for Indian homes. Free downloads.">
<meta property="og:image" content="store-icon-512.png">
<link rel="icon" href="store-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="store-icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
/* Layout: sticky store bar with search + tabs; views (home, categories, app page, library, search, publish) render into one column up to 1080px */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --sunk:#eaeef7; --ink:#101a3a; --muted:#5d6884; --line:#dde3ee;
  --navy:#13235b; --navy2:#1d3380; --acc:#e8650a; --acc-ink:#ffffff; --link:#2445a8; --star:#f5a400; --ok:#15803d; --warn:#b45309;
  --f:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1f; --surface:#131a30; --sunk:#1a2341; --ink:#e8ecf8; --muted:#9ba6c3; --line:#26304e; --link:#9db7ff; --acc:#ff8a3d; --acc-ink:#1a0d02; --ok:#4ade80; --warn:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1f; --surface:#131a30; --sunk:#1a2341; --ink:#e8ecf8; --muted:#9ba6c3; --line:#26304e; --link:#9db7ff; --acc:#ff8a3d; --acc-ink:#1a0d02; --ok:#4ade80; --warn:#fbbf24; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:var(--link)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit}
:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
.w{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(5,10,30,.25)}
.bar .w{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:19px;flex:none}
.logo img{width:34px;height:34px;display:block}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;border:0;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:15px;padding:10px 16px 10px 42px;outline:none}
.search input::placeholder{color:#b8c5ea}
.search input:focus{background:#fff;color:#101a3a}
.search input:focus::placeholder{color:#7a86a6}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#b8c5ea;pointer-events:none}
.search input:focus+svg{color:#5d6884}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(5,10,30,.25);overflow:hidden;z-index:5}
.sugg a{display:flex;gap:12px;align-items:center;padding:10px 14px;color:inherit;text-decoration:none}
.sugg a:hover,.sugg a[aria-selected="true"]{background:var(--sunk)}
.sugg img{width:36px;height:36px;border-radius:9px}
.sugg small{display:block;color:var(--muted);font-size:13px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none;position:relative}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--acc);border:2px solid var(--navy)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:#c9d4f3;text-decoration:none;font-weight:700;font-size:14.5px;padding:10px 14px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:#fff;border-color:var(--acc)}
@media (max-width:620px){.logo span{display:none}.bar .w{gap:10px}}

/* generic */
main{padding-block:22px 64px;min-height:70vh}
main:focus{outline:none}
.sec{margin-top:34px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:800}
.sec-h a{font-weight:700;font-size:14px;text-decoration:none}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:0;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.go{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.go:hover{filter:brightness(1.06)}
.btn.out{background:transparent;color:var(--link);border:1.5px solid var(--line)}
.btn.out:hover{background:var(--sunk)}
.btn.out[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none}
.chip:hover{background:var(--sunk)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.stars-s{color:var(--star);letter-spacing:1px}

/* hero (featured) */
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:300px;text-decoration:none}
.hero .txt{padding:30px;display:grid;align-content:center;gap:12px;position:relative;z-index:1}
.hero .k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd7b8}
.hero h2{font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.1}
.hero p{margin:0;color:#d5def7;max-width:44ch}
.hero .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.hero .row img{width:56px;height:56px;border-radius:14px;background:#fff}
.hero .row b{display:block}.hero .row small{color:#c3cff2}
.hero .peek{position:relative;display:flex;gap:14px;justify-content:center;align-items:flex-end;padding:26px 20px 0}
.hero .peek img{width:42%;max-width:170px;border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.35);display:block}
.hero .peek img:nth-child(2){transform:translateY(-22px)}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.hero .peek{height:200px;overflow:hidden;align-items:flex-start;padding-top:0}.hero .peek img{width:38%}}

/* app tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;text-decoration:none;color:inherit}
.tile:hover{background:var(--sunk)}
.tile img{width:68px;height:68px;border-radius:16px;display:block;border:1px solid var(--line)}
.tile b{display:block;font-size:16px;line-height:1.3}
.tile .meta{font-size:13.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tile p{margin:4px 0 0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.cat{display:flex;gap:12px;align-items:center;padding:14px 16px;text-decoration:none;color:inherit;font-weight:700}
.cat:hover{background:var(--sunk)}
.cat .e{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:20px;flex:none;font-weight:800;color:var(--navy2)}
.cat small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.trust div{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.trust svg{width:24px;height:24px;color:var(--acc)}
.trust b{display:block}.trust span{font-size:14px;color:var(--muted)}

/* app page */
.ahead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:start}
.ahead .ic{width:120px;height:120px;border-radius:28px;display:block;box-shadow:0 10px 30px rgba(5,10,30,.18);border:1px solid var(--line)}
.ahead h1{font-size:clamp(26px,4.2vw,40px);font-weight:800;line-height:1.1}
.ahead .dev{font-weight:700;margin-top:6px;display:inline-block;text-decoration:none}
.ahead .tg{color:var(--muted);margin:6px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;margin-top:18px}
.stat{padding:2px 18px;border-left:1px solid var(--line);text-align:center;min-width:0}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font-size:16px;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.qr{padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;width:180px}
.qr svg{width:140px;height:140px;display:block;background:#fff;border-radius:8px}
.qr small{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.35}
@media (max-width:900px){.qr{display:none}.ahead{grid-template-columns:auto minmax(0,1fr)}}
@media (max-width:560px){.ahead{grid-template-columns:minmax(0,1fr);gap:14px}.ahead .ic{width:84px;height:84px;border-radius:20px}.acts .go{flex:1}.stat{padding:2px 12px}}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.rail button{flex:none;width:min(44vw,190px);border:0;padding:0;background:none;cursor:zoom-in;scroll-snap-align:start;text-align:left;color:inherit}
.rail img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block;background:var(--sunk)}
.rail small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:34px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.feats{display:grid;gap:18px;margin-top:8px}
.feats h3{font-size:16px;font-weight:800;margin-bottom:4px}
.feats ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:2px}
.clamp{max-height:330px;overflow:hidden;position:relative}
.clamp::after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,var(--bg))}
.more{border:0;background:none;color:var(--link);font-weight:800;padding:6px 0;cursor:pointer}
.labels{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.labels span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.new{padding:16px 18px}
.new .v{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.new ul{margin:0;padding-left:18px;display:grid;gap:4px}
details.hist{margin-top:10px}
details.hist summary{cursor:pointer;font-weight:800;color:var(--link);padding:6px 0}
.hist ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.hist li{border-left:3px solid var(--line);padding-left:14px}
.hist li b{font-size:14px}.hist li ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
.safety div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.safety div:first-child{border-top:0}
.safety svg{width:22px;height:22px;color:var(--link);margin-top:2px}
.safety b{display:block;font-size:15px}.safety span{font-size:14px;color:var(--muted)}
.rsum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:18px}
.rsum .big{font-size:52px;font-weight:800;line-height:1;text-align:center}
.rsum .big small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.bars{display:grid;gap:4px}
.bars div{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.bars i{display:block;height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bars i::before{content:"";display:block;height:100%;width:var(--p);background:var(--star);border-radius:9px}
.rev{padding:16px 0;border-top:1px solid var(--line)}
.rev .who{display:flex;gap:10px;align-items:center;font-weight:700}
.rev .av{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;color:var(--navy2);font-size:14px}
.rev p{margin:8px 0 0}
.rev .rep{margin-top:10px;background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:14.5px}
.form{padding:18px;display:grid;gap:14px}
.fl{display:grid;gap:6px;font-weight:700;font-size:14px;min-width:0}
.fl input,.fl textarea,.fl select{font:inherit;font-weight:500;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.rate{border:0;padding:0;margin:0;display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate legend{font-weight:700;font-size:14px;margin-bottom:4px;float:left;width:100%}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label{font-size:34px;line-height:1;color:var(--line);cursor:pointer}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--star)}
.rate input:focus-visible+label{outline:3px solid #38bdf8;border-radius:6px}
.note{font-size:14px;color:var(--muted);margin:0}
.side{display:grid;gap:16px}
.side .card{padding:18px}
.side h3{font-size:16px;font-weight:800;margin-bottom:10px}
.links{display:grid;gap:2px}
.links a,.links button{display:flex;gap:12px;align-items:center;padding:10px 6px;border-radius:10px;text-decoration:none;color:inherit;font-weight:700;font-size:15px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.links a:hover,.links button:hover{background:var(--sunk)}
.links svg{width:20px;height:20px;color:var(--link);flex:none}
.links small{display:block;color:var(--muted);font-weight:500;font-size:13px;overflow-wrap:anywhere}
dl.info{display:grid;gap:12px;margin:0}
dl.info dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
dl.info dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere;font-size:15px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none;font-weight:700}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,9,22,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:24px;position:relative}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:6px;padding-right:44px}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);cursor:pointer;font-size:20px;line-height:1}
.steps{margin:14px 0 0;padding-left:22px;display:grid;gap:10px}
.steps li::marker{font-weight:800;color:var(--acc)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(3,6,15,.94);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;display:grid;justify-items:center;gap:10px;min-width:0}
.lb img{max-height:82vh;max-width:100%;border-radius:18px;display:block}
.lb figcaption{color:#cdd6f0;font-weight:700;text-align:center}
.lb .nav{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.lb .x{background:rgba(255,255,255,.14);color:#fff;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;z-index:70;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px}
.lrow img{width:56px;height:56px;border-radius:14px;border:1px solid var(--line)}
.lrow b{display:block}
.lrow + .lrow{border-top:1px solid var(--line)}
pre.json{background:var(--sunk);border-radius:14px;padding:14px;overflow:auto;font-size:13px;max-height:420px;margin:0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .w{padding-block:26px 40px;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:8px 18px}
footer a{color:inherit;font-weight:700;text-decoration:none}
footer a:hover{color:var(--link)}
@media (prefers-reduced-motion:no-preference){.tile,.cat,.btn{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<header class="bar">
  <div class="w">
    <a class="logo" href="#/" aria-label="AppBucket home"><img src="store-icon.svg" alt="" width="34" height="34"><span id="storeName">AppBucket</span></a>
    <div class="search" role="search">
      <label class="sr" for="q">Search apps</label>
      <input id="q" type="search" placeholder="Search apps" autocomplete="off" aria-autocomplete="list" aria-controls="sugg" enterkeyhint="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
    <a class="iconbtn" href="#/library" aria-label="My apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><i class="dot" id="updDot" hidden></i></a>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch to dark mode"></button>
  </div>
  <div class="w"><nav class="tabs" aria-label="Store sections">
    <a href="#/" data-tab="home">For you</a>

<script>
(function(){

/* ---------- tiny helpers ---------- */

/* ---------- theme ---------- */
const root=document.documentElement;
function isDark(){const t=root.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}

$("#themeBtn").addEventListener("click",()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;store.set("theme",t);paintTheme()});
paintTheme();

/* ---------- data ---------- */
let D=null, APPS=[], BYID={}, COUNTS=null;
/* Download totals: live count from /api/downloads plus any baseDownloads set in apps.json */
const total=a=>COUNTS?Number(a.baseDownloads||0)+Number(COUNTS[a.id]||0):null;
function bucket(n){if(n==null)return null;if(n<1)return"New";return Number(n).toLocaleString("en-IN")}
const fmtN=n=>Number(n).toLocaleString("en-IN");
function loadCounts(){return fetch("api/downloads",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(c=>{if(c&&typeof c==="object"&&!Array.isArray(c)){COUNTS=c;return true}}).catch(()=>false)}
const catOf=id=>D.categories.find(c=>c.id===id)||{id,name:id,emoji:"•"};
function rating(a){const r=a.reviews||[];if(!r.length)return null;const avg=r.reduce((s,x)=>s+Number(x.rating||0),0)/r.length;return{avg:Math.round(avg*10)/10,n:r.length}}
function libState(a){const lib=store.get("lib",{}),me=lib[a.id];if(!me)return null;return{...me,update:Number(me.code||0)<Number(a.versionCode||0)}}
function updatesCount(){return APPS.filter(a=>{const s=libState(a);return s&&s.update}).length}
function appURL(a){return location.origin+location.pathname+"#/app/"+a.id}

/* ---------- pieces ---------- */
function tile(a){

  return `<a class="card tile" href="#/app/${esc(a.id)}"><img src="${esc(a.icon)}" alt="" width="68" height="68" loading="lazy"><div style="min-width:0"><b>${esc(a.name)}</b>
  <div class="meta num"><span>${esc(c.name)}</span>${r?`<span>${r.avg} <span class="stars-s">★</span></span>`:""}${total(a)!=null?`<span>${bucket(total(a))}${total(a)>0?(total(a)===1?" download":" downloads"):""}</span>`:""}<span>${esc(a.size)}</span>${a.price&&a.price!=="Free"?`<span>${esc(a.price)}</span>`:""}</div>
  <p>${esc(a.tagline)}</p></div></a>`;
}
function catTile(c,n){
  return `<a class="card cat" href="#/category/${esc(c.id)}"><span class="e" aria-hidden="true">${esc(c.emoji)}</span><span>${esc(c.name)}<small class="num">${n?n+(n>1?" apps":" app"):"Coming soon"}</small></span></a>`;
}
function setTab(t){$$(".tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
function title(t){document.title=t?`${t} · ${D.store.name}`:`${D.store.name}: ${D.store.tagline}`}

/* ---------- views ---------- */

  return `
  ${f?`<section class="sec" aria-label="Featured app"><a class="hero" href="#/app/${esc(f.id)}" style="background:radial-gradient(90% 120% at 100% 0%,color-mix(in srgb,${esc(f.color||"#13235b")} 40%,#3b63d6) 0%,transparent 60%),linear-gradient(150deg,${esc(f.color||"#13235b")},#0d1a4a)">

}

function search(q){
  q=q.trim().toLowerCase();if(!q)return[];
  const words=q.split(/\s+/);
  return APPS.map(a=>{const hay=[a.name,a.tagline,catOf(a.category).name,(a.tags||[]).join(" "),a.about].join(" ").toLowerCase();
    let s=0;for(const w of words){if(!hay.includes(w))return null;if(a.name.toLowerCase().includes(w))s+=3;if((a.tags||[]).some(t=>t.startsWith(w)))s+=2;s+=1}
    return{a,s}}).filter(Boolean).sort((x,y)=>y.s-x.s).map(x=>x.a);
}

let lastFocus=null;
function openSheet(html,label){

  document.body.appendChild(ov);document.body.style.overflow="hidden";

  ov.addEventListener("click",e=>{if(e.target===ov||e.target.classList.contains("x")||e.target.closest("[data-close]"))close()});
  ov.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function lightbox(a,i){
  lastFocus=document.activeElement;const s=a.screenshots;
  const lb=document.createElement("div");lb.className="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-modal","true");lb.setAttribute("aria-label","Screenshots");
  const draw=()=>{lb.innerHTML=`<button class="nav" type="button" data-d="-1" aria-label="Previous">‹</button><figure><img src="${esc(s[i].src)}" alt="${esc(s[i].caption)}"><figcaption class="num">${esc(s[i].caption)} · ${i+1}/${s.length}</figcaption></figure><button class="nav" type="button" data-d="1" aria-label="Next">›</button><button class="x" type="button" aria-label="Close">×</button>`};
  draw();document.body.appendChild(lb);document.body.style.overflow="hidden";$(".x",lb).focus();
  const close=()=>{lb.remove();document.body.style.overflow="";if(lastFocus)lastFocus.focus()};
  const go=d=>{i=(i+d+s.length)%s.length;draw();$(".x",lb).focus()};
  lb.addEventListener("click",e=>{const b=e.target.closest("button");if(e.target===lb||(b&&b.classList.contains("x")))close();else if(b&&b.dataset.d)go(Number(b.dataset.d))});
  lb.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
  let x0=null;lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1);x0=null});
}

/* Unique visitors: each browser is counted once, using a random id kept in this browser */
function countVisitor(){
  let vid=store.get("vid",null),known=!!vid;
  if(!vid){const r=new Uint8Array(18);try{crypto.getRandomValues(r)}catch(e){for(let i=0;i<18;i++)r[i]=Math.random()*256}
    vid=btoa(String.fromCharCode(...r)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");store.set("vid",vid)}
  const show=n=>{if(typeof n!=="number"||n<1)return;$("#visN").textContent=n.toLocaleString("en-IN");$("#visitors").hidden=false};
  const req=store.get("vcounted",false)&&known?fetch("api/visitors",{cache:"no-store"})
    :fetch("api/visitors",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vid})});
  req.then(r=>r.ok?r.json():Promise.reject()).then(d=>{store.set("vcounted",true);show(d.visitors)}).catch(()=>{});
}

      const btn=f.querySelector("button[type=submit]");btn.disabled=true;
      try{const r=await post("review",{app:a.id,rating:rt,name:f.name.value,review:f.review.value,"bot-field":f["bot-field"].value});if(!r.ok)throw 0;f.reset();out.textContent="Thank you! Your review will appear once it's checked.";out.hidden=false}
      catch(err){out.textContent="Couldn't send. Check your internet and try again.";out.hidden=false}finally{btn.disabled=false}});
  }
  if(p==="publish"){$("#pubForm").addEventListener("input",pubBuild);pubBuild()}
  if(!keep)window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{render();$("#view").focus({preventScroll:true})});

/* ---------- boot ---------- */
fetch("apps.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  D=d;APPS=d.apps||[];BYID=Object.fromEntries(APPS.map(a=>[a.id,a]));
  $("#storeName").textContent=d.store.name;$("#footName").textContent=`${d.store.name} · Made in ${d.store.city}`;
  render();paintUpd();
  loadCounts().then(ok=>{if(ok)render(true)});
  countVisitor();
}).catch(()=>{$("#view").innerHTML=`<div class="card empty"><b>The store couldn't load</b>Check your internet connection and refresh the page.</div>`});

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body>
</html>
