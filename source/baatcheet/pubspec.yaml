name: baatcheet
description: BaatCheet - chat, groups, Moments and calls with friends and family.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  mobile_scanner: ^6.0.10
  qr_flutter: ^4.1.0
  flutter_webrtc: ^0.12.12
  permission_handler: ^11.4.0
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
