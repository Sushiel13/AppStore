name: Build AdShield and publish to appbucket.in

on:
  push:
    branches: [ adshield-src ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adshield-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.ADSHIELD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/adshield.jks"
            echo "ADSHIELD_KEYSTORE=$RUNNER_TEMP/adshield.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ADSHIELD_KEYSTORE_B64 secret not set - signing with a temporary debug key"
          fi

      - name: Build APK
        env:
          ADSHIELD_KEYSTORE_PASSWORD: ${{ secrets.ADSHIELD_KEYSTORE_PASSWORD }}
          ADSHIELD_KEY_ALIAS: ${{ secrets.ADSHIELD_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AdShield-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Check out the store (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: store

      - name: Copy APK into the store and update apps.json
        env:
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p store/apps/adshield
          cp app/build/outputs/apk/release/app-release.apk store/apps/adshield/AdShield.apk
          python3 - <<'PY'
          import json, os, datetime
          path = "store/apps.json"
          d = json.load(open(path, encoding="utf-8"))
          size = os.path.getsize("store/apps/adshield/AdShield.apk") / 1024 / 1024
          run = int(os.environ["RUN"])
          for a in d["apps"]:
              if a["id"] == "adshield":
                  a["size"] = f"{size:.1f} MB"
                  a["version"] = f"1.0.{run}"
                  a["versionCode"] = run
                  a["updated"] = datetime.date.today().isoformat()
                  if a.get("changelog"):
                      a["changelog"][0]["version"] = a["version"]
          json.dump(d, open(path, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          open(path, "a").write("\n")
          PY

      - name: Push to the store
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/adshield/AdShield.apk apps.json
          git commit -m "AdShield 1.0.${{ github.run_number }} (from ${GITHUB_SHA::7})" || exit 0
          git push origin HEAD:main
