name: BaatCheet APK

on:
  push:
    branches: [main]
    paths:
      - 'source/baatcheet/**'
      - '.github/workflows/baatcheet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baatcheet
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/baatcheet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Create and patch the Android project
        run: |
          flutter create --platforms android --org in.appbucket --project-name baatcheet --no-pub .
          rm -rf test
          python3 tool/setup_android.py
          python3 tool/gen_firebase_options.py

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Signing key
        env:
          KS: ${{ secrets.BAATCHEET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BC_KEYSTORE_PASSWORD=baatcheet-store" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "BC_KEYSTORE=$PWD/android-config/test-signing.jks" >> "$GITHUB_ENV"
            echo "BC_KEYSTORE_PASSWORD=baatcheet-test" >> "$GITHUB_ENV"
            echo "::warning::BAATCHEET_KEYSTORE_B64 secret not set - signing with the test key"
          fi
          echo "BC_KEY_ALIAS=baatcheet" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number ${{ github.run_number }}
          ls -l build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: BaatCheet-apk
          path: source/baatcheet/build/app/outputs/flutter-apk/app-release.apk

      - name: Save the APK to the store
        working-directory: .
        run: |
          mkdir -p apps/baatcheet
          cp source/baatcheet/build/app/outputs/flutter-apk/app-release.apk apps/baatcheet/BaatCheet.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/baatcheet/BaatCheet.apk
          git commit -m "BaatCheet APK build ${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push
